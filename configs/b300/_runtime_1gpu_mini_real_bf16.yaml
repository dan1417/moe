# 1×B300 real Teutonic CPT (shrink). Prep: python scripts/data/prepare_train_sequence_pool.py --config configs/b300/1gpu_mini_real.yaml --world-size 1
# Launch: bash scripts/train/run_b300_1gpu.sh --config configs/b300/1gpu_mini_real.yaml

hardware:
  gpus_per_node: 1
  num_nodes: 1

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  activation_checkpointing: true
  activation_checkpointing_mode: selective
  low_precision: none
  low_precision_strict: true
  fp8_training: false
  total_steps: 20
  smoke_steps: 0
  log_every: 1
  base_seed: 42
  profile: mini
  king_dir: ./pipeline_model
  output_dir: ./checkpoints/b300_1gpu_mini_real
  eval_batch_size: 1
  attn_implementation: flash_attention_4
  smoke_seq_len: 256
  smoke_vocab_size: 152576
  smoke_synthetic_data: false
  smoke_patterned_data: false
  smoke_pattern_period: 32

scheduler:
  type: wsd
  warmup_steps: 20
  stable_steps: 800
  decay_steps: 100
  lr_max: 3.0e-4
  lr_min: 3.0e-5

optimizer:
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_weight_decay: 0.05
  muon_rms_scale: 0.2
  adamw_lr: 3.0e-4
  adamw_lr_min: 3.0e-5
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8
  adamw_weight_decay: 0.1
  adamw_bf16_states: true
  router_lr_scale: 0.1
  gradient_clip:
    expert_ffn: 1.0
    attention: 1.0
    router: 0.5

moe:
  bias_update_speed: 0.001
  z_loss_coeff: 1.0e-4
  seq_aux_alpha: 1.0e-4
  node_limit: 1
  dispatch_overlap: false
  delay_wgrad: false

sparse_loco:
  enabled: false

parallelism:
  fsdp: true
  fsdp_cpu_offload: false

compilation:
  enabled: false

packing:
  enabled: false

checkpoint_averaging:
  enabled: true
  n_checkpoints: 3
  save_every_stable: 10
  min_step_gap: 5

lora:
  enabled: false
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules: [qkv_proj, o_proj]
  freeze_base: true
  train_routers: true
  save_full_checkpoint: false

qk_norm:
  enabled: false

submission:
  output_dir: ./submit_model
  genesis_dir: ./genesis
  safety_margin: 0.05

data:
  cache_dir: ./shard_cache
  cache_max_gb: 200
  manifest_url: https://teutonic.ai/datasets/manifest.json
  manifest_refresh_interval: 100
  manifest_cache_ttl_sec: 60
  num_workers: 2
  prefetch_factor: 4
  eval_prefetch_workers: 8
  pin_memory: true
  persistent_workers: true

  sequence_pool:
    enabled: true
    pool_dir: ./sequence_pool_b300_1gpu
    shards_per_source_range: [1, 4]
    seqs_per_shard_range: [1, 32]
