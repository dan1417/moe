# Line B on this node: same recipe as line A but ALL parameters trainable except routers
# (fp32 master + AdamW ≈ 250 GB/GPU — only if the gate run showed headroom), different pool and seed.
# Soup the A and B EMA exports 50/50 afterwards (recipe JSON with the two export dirs as terms).
#   bash scripts/train/node_train.sh configs/cpt/node/line_b_full.yaml
king_dir: /dev/shm/teutonic/start
output_dir: /workspace/teutonic/runs/line_b
export_dir: /mnt/ram/runs/line_b/exports
export_keep: 2
seed: 98
attention: flash_attention_4
activation_checkpointing: true
freeze:
  - '\.mlp\.gate\.weight$'
  - '\.mlp\.gate\.e_score_correction_bias$'
optimizer:
  lr: 1.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  grad_clip: 1.0
schedule:
  total_steps: 2000
  warmup_steps: 50
  decay_steps: 200
  min_lr_ratio: 0.0
ema:
  enabled: true
  decay: 0.99
  every: 5
data:
  pool_dir: /workspace/teutonic/pools/line_b
  val_dir: /workspace/teutonic/pools/val
  val_n: 2048
  king_val_losses: /workspace/teutonic/pools/val/king30_losses.npy
  micro_batch: 4
  grad_accum: 8
  seed: 98
log_every: 10
eval_every: 100
export_every: 250
export_raw: false
checkpoint: {every: 0, keep: 1, resume: false}
