# Line A3b: continue from line A2's EMA@250 (+0.0025 vs king #30) with less gradient noise per update:
#   * 1M-token steps (mb 8 x accum 8) instead of 524k             -> noise std / sqrt(2)
#   * beta1 0.95 instead of 0.9 (momentum averages ~20 steps)     -> ~1.4x less noise in the update direction
#   * routed experts at 1/3 of the dense lr (each expert sees 1/32 of the tokens -> ~6x noisier gradients)
# A2 (lr 3e-6, 524k, beta1 0.9) plateaued at EMA +0.0025 by step 200-300 while its raw weights kept sliding: noise-bound.
king_dir: /mnt/ram/runs/line_a2/exports/step000250_ema   # start: A2 EMA@250 (set after the parity screen)
output_dir: /workspace/teutonic/runs/line_a3b
export_dir: /mnt/ram/runs/line_a3b/exports
export_keep: 2                                      # RAM disk: keep the 2 newest (touch <export>/KEEP to pin one)
seed: 99
attention: flash_attention_4
activation_checkpointing: true
freeze:
  - '\.mlp\.gate\.weight$'
  - '\.mlp\.gate\.e_score_correction_bias$'
  - '^model\.embed_tokens\.'
  - '^model\.layers\.([0-9]|1[0-5])\.'
optimizer:
  lr: 3.0e-6
  groups:
    - {pattern: '\.mlp\.grouped\.', lr_mult: 0.333}   # routed experts
  betas: [0.95, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  grad_clip: 1.0
schedule:
  total_steps: 1500      # hard cap ≈ 1.6B tokens; expected to stop earlier via COOLDOWN
  warmup_steps: 100
  decay_steps: 150       # linear cooldown length (also used by the COOLDOWN trigger)
  min_lr_ratio: 0.0
ema:
  enabled: true
  decay: 0.99
  every: 5
data:
  pool_dir: /workspace/teutonic/pools/line_b      # fresh data: A2 consumed ~77k seqs of line_a
  val_dir: /workspace/teutonic/pools/val
  val_n: 2048
  king_val_losses: /workspace/teutonic/pools/val/king30_losses.npy   # real king on the same val sequences
  micro_batch: 8
  grad_accum: 8          # 8 ranks x 8 x 8 = 512 seqs = 1.05M tokens/step
  seed: 99
log_every: 10
eval_every: 50
export_every: 200        # EMA export (bf16, 220 GB on /mnt/ram)
export_raw: false
checkpoint: {every: 0, keep: 1, resume: false}     # DCP (1.3 TB) impossible on this node
