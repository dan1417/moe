# Gate run on THIS node (8xB300, RAM-disk storage): full-parameter memory/throughput check starting
# from king #30 itself. Also writes the king's per-sequence val losses (start_val_losses.npy) which
# the real lines use as data.king_val_losses, and an export round-trip at step 0.
#   bash scripts/train/node_train.sh configs/cpt/node/gate_full.yaml --max-steps 6
king_dir: /dev/shm/teutonic/king30
output_dir: /workspace/teutonic/runs/gate_full
export_dir: /mnt/ram/runs/gate_full/exports
export_keep: 0          # gate: keep both exports for the round-trip check; delete by hand
seed: 0
attention: flash_attention_4
activation_checkpointing: true
freeze:
  - '\.mlp\.gate\.weight$'
  - '\.mlp\.gate\.e_score_correction_bias$'
optimizer: {lr: 1.0e-5, betas: [0.9, 0.95], eps: 1.0e-8, weight_decay: 0.0, grad_clip: 1.0}
schedule: {total_steps: 6, warmup_steps: 2, decay_steps: 2, min_lr_ratio: 0.0}
ema: {enabled: true, decay: 0.99, every: 5}
data:
  pool_dir: /workspace/teutonic/pools/val      # gate only: reuse the val pool as training data
  val_dir: /workspace/teutonic/pools/val
  val_n: 2048
  micro_batch: 4
  grad_accum: 8
  seed: 0
log_every: 1
eval_every: 1000
export_every: 0
export_raw: false
export_at_start: true
checkpoint: {every: 0, keep: 1, resume: false}
